<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Runya Ventures Private Limited — Furniture, interior works, hospital furniture, indoor and outdoor furniture, bulk furniture supply, and steel and wooden furnitu[...]

<meta name="theme-color" content="#08090b">

<title>Runya Ventures | Furniture & Interior Solutions</title>

<style>

/* =========================
   ROOT
========================= */

:root{
    --bg:#08090b;
    --bg2:#0d0f12;
    --card:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.11);
    --text:#f4f3ef;
    --muted:#a7a7a2;
    --gold:#d7b46a;
    --gold2:#f0d18a;
    --max:1180px;
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(
            circle at 75% 10%,
            rgba(215,180,106,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 55%,
            rgba(255,255,255,.035),
            transparent 25%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    line-height:1.6;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

.container{
    width:min(var(--max),92%);
    margin:auto;
}

.gold{
    color:var(--gold2);
}

h1,h2,h3{
    line-height:1.05;
}

h2{
    font-size:clamp(2rem,5vw,4rem);
    letter-spacing:-.04em;
}

p{
    color:var(--muted);
}

.eyebrow{
    color:var(--gold2);
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:.72rem;
    font-weight:700;
    margin-bottom:14px;
}


/* =========================
   BUTTONS
========================= */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    min-height:48px;
    padding:0 20px;

    border-radius:999px;
    border:1px solid var(--line);

    transition:
        .35s cubic-bezier(.2,.8,.2,1);

    font-weight:700;
    font-size:.9rem;
}

.btn:hover{
    transform:translateY(-4px);

    border-color:
        rgba(215,180,106,.65);

    box-shadow:
        0 14px 35px rgba(0,0,0,.3);
}

.btn-primary{
    background:var(--gold);
    color:#12110d;
    border-color:var(--gold);
}

.btn-dark{
    background:rgba(255,255,255,.04);
}


/* =========================
   SECTION
========================= */

.section{
    padding:105px 0;
    position:relative;
}

.section-head{
    display:flex;
    justify-content:space-between;
    gap:40px;
    align-items:end;
    margin-bottom:50px;
}

.section-head p{
    max-width:520px;
}


/* =========================
   CURSOR LIGHT
========================= */

.cursor-glow{
    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    pointer-events:none;

    z-index:0;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(215,180,106,.10),
            transparent 68%
        );

    mix-blend-mode:screen;
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;

    z-index:50;

    background:
        rgba(8,9,11,.55);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

nav{
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    font-weight:900;
    letter-spacing:.08em;
}

.brand img{
    width:48px;
    height:48px;

    object-fit:contain;

    border-radius:12px;
}

.brand span{
    font-size:.9rem;
}

.navlinks{
    display:flex;
    gap:26px;
    align-items:center;
}

.navlinks a{
    font-size:.82rem;
    color:#c8c8c3;
    transition:.25s;
}

.navlinks a:hover{
    color:var(--gold2);
}

.nav-cta{
    display:flex;
    gap:8px;
}

.menu{
    display:none;

    border:0;
    background:none;

    color:white;

    font-size:1.6rem;

    cursor:pointer;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;

    display:grid;
    place-items:center;

    position:relative;

    overflow:hidden;

    padding-top:78px;
}

.hero-grid{
    position:absolute;
    inset:0;

    opacity:.18;

    background-image:
        linear-gradient(
            rgba(255,255,255,.06) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.06) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 82%
        );

    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
    to{
        background-position:
            70px 70px;
    }
}

.hero-inner{
    position:relative;
    z-index:2;

    width:min(var(--max),92%);

    margin:auto;
}

.hero-copy{
    max-width:850px;
}

.hero-logo{
    display:flex;
    justify-content:center;
    margin-bottom:30px;
    animation:
        heroIn 1.2s
        cubic-bezier(.2,.8,.2,1)
        both;
}

.hero-logo img{
    height:120px;
    width:auto;
    object-fit:contain;
}

.hero h1{
    font-size:
        clamp(
            3.5rem,
            9vw,
            8.3rem
        );

    letter-spacing:-.075em;

    margin-bottom:26px;

    animation:
        heroIn 1.2s
        cubic-bezier(.2,.8,.2,1)
        both;
}

.hero h1 span{
    display:inline-block;

    background:
        linear-gradient(
            110deg,
            #fff,
            var(--gold2),
            #fff
        );

    background-size:220% auto;

    color:transparent;

    background-clip:text;

    animation:
        shine 5s linear infinite;
}

@keyframes shine{
    to{
        background-position:
            220% center;
    }
}

@keyframes heroIn{
    from{
        opacity:0;
        transform:
            translateY(45px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.hero-copy>p{
    font-size:1.08rem;
    max-width:690px;

    animation:
        heroIn 1.2s .15s both;
}

.hero-actions{
    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:30px;

    animation:
        heroIn 1.2s .3s both;
}


/* Decorative Orb */

.hero-orb{
    position:absolute;

    right:-8vw;
    top:14%;

    width:48vw;
    height:48vw;

    max-width:650px;
    max-height:650px;

    border:
        1px solid
        rgba(215,180,106,.2);

    border-radius:50%;

    animation:
        orb 12s
        ease-in-out
        infinite;
}

.hero-orb:before,
.hero-orb:after{
    content:"";

    position:absolute;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:50%;

    inset:10%;

    transform:rotate(25deg);
}

.hero-orb:after{
    inset:22%;

    transform:
        rotate(-35deg);
}

@keyframes orb{
    50%{
        transform:
            translateY(-20px)
            rotate(12deg);
    }
}

.float-tag{
    position:absolute;

    right:11%;
    bottom:16%;

    padding:14px 18px;

    background:
        rgba(12,13,16,.78);

    border:
        1px solid
        var(--line);

    backdrop-filter:blur(12px);

    border-radius:16px;

    font-size:.75rem;

    color:#ddd;

    animation:
        float 5s
        ease-in-out
        infinite;
}

@keyframes float{
    50%{
        transform:
            translateY(-14px);
    }
}


/* =========================
   TICKER
========================= */

.ticker{
    overflow:hidden;

    border-top:
        1px solid var(--line);

    border-bottom:
        1px solid var(--line);

    background:#0b0c0f;
}

.ticker-track{
    display:flex;

    width:max-content;

    animation:
        ticker 28s
        linear
        infinite;
}

.ticker span{
    padding:17px 30px;

    color:#bdbdb7;

    font-size:.72rem;

    letter-spacing:.16em;

    text-transform:uppercase;
}

.ticker b{
    color:var(--gold2);
}

@keyframes ticker{
    to{
        transform:
            translateX(-50%);
    }
}


/* =========================
   SOLUTION CARDS
========================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}

.card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        var(--line);

    border-radius:var(--radius);

    padding:30px;

    position:relative;

    overflow:hidden;

    transition:
        .45s
        cubic-bezier(.2,.8,.2,1);
}

.card:before{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    right:-80px;
    top:-80px;

    background:
        rgba(215,180,106,.12);

    filter:blur(20px);
}

.card:hover{
    transform:
        translateY(-10px);

    border-color:
        rgba(215,180,106,.35);
}

.card-number{
    font-size:.7rem;

    color:var(--gold2);

    letter-spacing:.18em;

    margin-bottom:65px;
}

.card h3{
    font-size:1.5rem;

    margin-bottom:10px;
}

.card p{
    font-size:.9rem;
}


/* =========================
   COMPANY
========================= */

.company-grid{
    display:grid;

    grid-template-columns:
        1.1fr .9fr;

    gap:20px;
}

.info-panel{
    border:
        1px solid var(--line);

    border-radius:var(--radius);

    padding:34px;

    background:
        rgba(255,255,255,.035);
}

.facts{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:1px;

    background:
        var(--line);

    margin-top:28px;
}

.fact{
    background:#0c0e11;

    padding:22px;
}

.fact small{
    display:block;

    color:#777;

    font-size:.7rem;

    text-transform:uppercase;

    letter-spacing:.12em;

    margin-bottom:6px;
}

.fact strong{
    font-size:.95rem;
}

.address{
    margin-top:20px;

    padding:20px;

    border-left:
        2px solid
        var(--gold);

    background:
        rgba(215,180,106,.045);
}

.address strong{
    display:block;

    margin-bottom:5px;
}


/* =========================
   DIRECTORS
========================= */

.directors{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}

.director{
    border:
        1px solid var(--line);

    border-radius:var(--radius);

    overflow:hidden;

    background:#0d0f12;

    transition:
        .45s
        cubic-bezier(.2,.8,.2,1);
}

.director:hover{
    transform:
        translateY(-8px);

    border-color:
        rgba(215,180,106,.35);
}

.director-photo{
    height:350px;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #191a1d,
            #090a0c
        );
}

.director-photo img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:
        transform .8s
        cubic-bezier(.2,.8,.2,1);
}

.director:hover
.director-photo img{
    transform:scale(1.06);
}

.director-info{
    padding:25px;
}

.director-info .role{
    color:var(--gold2);

    font-size:.7rem;

    text-transform:uppercase;

    letter-spacing:.12em;

    font-weight:800;
}

.director-info h3{
    font-size:1.55rem;

    margin:7px 0 12px;
}

.director-info p{
    font-size:.86rem;

    margin-bottom:12px;
}

.director-info ul{
    list-style:none;

    color:#c5c5bf;

    font-size:.82rem;
}

.director-info li{
    padding:5px 0;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}


/* =========================
   CTA
========================= */

.cta{
    text-align:center;

    border:
        1px solid
        rgba(215,180,106,.25);

    border-radius:34px;

    padding:80px 25px;

    background:
        radial-gradient(
            circle at 50% 0,
            rgba(215,180,106,.15),
            transparent 45%
        ),
        rgba(255,255,255,.03);

    overflow:hidden;

    position:relative;
}

.cta h2{
    max-width:760px;

    margin:
        0 auto 18px;
}

.cta p{
    max-width:650px;

    margin:auto;
}

.cta .hero-actions{
    justify-content:center;
}


/* =========================
   FOOTER
========================= */

footer{
    padding:
        45px 0
        90px;

    border-top:
        1px solid var(--line);

    margin-top:50px;
}

.footer-grid{
    display:flex;

    justify-content:space-between;

    gap:30px;

    align-items:center;
}

.footer-note{
    font-size:.78rem;

    color:#70716e;

    margin-top:8px;
}

.footer-links{
    display:flex;

    gap:18px;

    font-size:.8rem;

    color:#999;
}


/* =========================
   FLOATING CONTACT
========================= */

.floating-actions{
    position:fixed;

    right:22px;
    bottom:22px;

    z-index:40;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.float-btn{
    width:52px;
    height:52px;

    border-radius:50%;

    display:grid;

    place-items:center;

    background:#111318;

    border:
        1px solid
        var(--line);

    font-size:1.15rem;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);

    transition:.3s;
